name: Release Publish to Maven Central

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    types:
      - closed
    branches:
      - 'release/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Detect version change
        id: version-check
        run: |
          # 获取当前版本号
          CURRENT_VERSION=$(grep -oP '(?<=<version>)[^<]+' pom.xml | head -1)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

          # 检测是否为 SNAPSHOT 版本
          if [[ "$CURRENT_VERSION" == *"SNAPSHOT"* ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "SNAPSHOT version detected, skipping publish"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
          fi

          # 检测版本号格式
          if [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_valid=true" >> $GITHUB_OUTPUT
          else
            echo "version_valid=false" >> $GITHUB_OUTPUT
          fi

          # 获取上一个提交的版本号（用于检测变化）
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR 合并场景：对比合并前的目标分支
            git fetch origin ${{ github.base_ref }}
            PREVIOUS_VERSION=$(git show HEAD~1:pom.xml | grep -oP '(?<=<version>)[^<]+' | head -1)
          else
            # Push 场景：对比上一个提交
            PREVIOUS_VERSION=$(git show HEAD~1:pom.xml | grep -oP '(?<=<version>)[^<]+' | head -1)
          fi
          echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
          echo "Previous version: $PREVIOUS_VERSION"

          # 检测版本号是否变化
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT_VERSION"
          fi

      - name: Skip if no version change
        if: steps.version-check.outputs.version_changed == 'false'
        run: |
          echo "Version not changed, skipping publish"
          exit 0

      - name: Skip if SNAPSHOT version
        if: steps.version-check.outputs.is_snapshot == 'true'
        run: |
          echo "SNAPSHOT version detected, skipping publish to Maven Central"
          exit 0

      - name: Validate version format
        if: steps.version-check.outputs.version_valid == 'false'
        run: |
          echo "Invalid version format: ${{ steps.version-check.outputs.current_version }}"
          echo "Expected format: X.Y.Z (e.g., 1.1.2)"
          exit 1

      - name: Build and publish to Maven Central
        if: steps.version-check.outputs.version_changed == 'true' && steps.version-check.outputs.is_snapshot == 'false' && steps.version-check.outputs.version_valid == 'true'
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "Publishing version ${{ steps.version-check.outputs.current_version }} to Maven Central"
          mvn clean deploy -DskipTests \
            -Dgpg.keyname=$GPG_KEYNAME \
            -Dgpg.passphrase=$GPG_PASSPHRASE \
            -Dgpg.executable=gpg \
            --batch-mode \
            --activate-profiles release

      - name: Publish summary
        if: steps.version-check.outputs.version_changed == 'true' && steps.version-check.outputs.is_snapshot == 'false' && steps.version-check.outputs.version_valid == 'true'
        run: |
          echo "✅ Successfully published version ${{ steps.version-check.outputs.current_version }} to Maven Central"
          echo "Note: It may take a few minutes to a few hours for the artifact to be available on Maven Central"
